on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize ]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby_version: '3.3'
            gemfile: rails_7_1
          - ruby_version: '3.2'
            gemfile: rails_7_1
          # - ruby_version: '3.1'
          #   gemfile: rails_7_1
          - ruby_version: '3.3'
            gemfile: rails_7_0
          - ruby_version: '3.3'
            gemfile: rails_6_1
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/spec/gemfiles/${{ matrix.gemfile }}.gemfile
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby ${{ matrix.ruby_version }} and ${{ matrix.gemfile }}.gemfile
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby_version }}
          bundler: ${{ matrix.bundler || 'Gemfile.lock' }}
          bundler-cache: true
          cache-version: 1000
      - name: Run tests
        run: bundle exec rspec --format d
  i18n-tasks:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/spec/gemfiles/i18n-tasks.gemfile
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby and i18n-tasks.gemfile
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true
      - name: Run i18n-tasks
        run: bundle exec i18n-tasks health
